[project]
name = "digitshowside"
version = "1.0.0"
description = "DigitShowSide - Real-time Measurement and Control Software"
readme = "README.md"
license = "GPL-3.0-or-later"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
requires-python = ">=3.14"
dependencies = [
    "pyside6>=6.11.2",
    "pyqtgraph>=0.14.0",
    "pymodbus>=3.15,<4",
    "pyserial>=3.5",
    "numpy>=2.5.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
]

